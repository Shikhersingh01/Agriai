<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AgriAI — Fertilizer AI 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a1a0a;overflow:hidden;font-family:'Segoe UI',sans-serif}
canvas{display:block}
#overlay{position:absolute;top:20px;left:20px;color:#a8c380;font-size:14px;z-index:10;pointer-events:none}
#overlay h2{color:#daa520;font-size:28px;margin-bottom:4px;text-shadow:0 0 20px rgba(218,165,32,.4)}
#result-panel{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(26,46,26,.85);backdrop-filter:blur(12px);border:1px solid rgba(168,195,128,.25);border-radius:16px;padding:20px 40px;text-align:center;color:#f0ead6;z-index:10;pointer-events:none;opacity:0;transition:opacity .6s}
#result-panel .value{font-size:36px;font-weight:900;color:#daa520;text-shadow:0 0 30px rgba(218,165,32,.5)}
#result-panel .unit{font-size:14px;color:#a8c380;letter-spacing:3px;text-transform:uppercase}
.npk-bar{display:flex;gap:20px;justify-content:center;margin-top:12px}
.npk-item{text-align:center}
.npk-item .letter{font-size:28px;font-weight:900}
.npk-item .val{font-size:14px;color:#b8c9a0}
</style>
</head>
<body>
<div id="overlay"><h2>🧪 Fertilizer AI</h2><p>NPK Molecular Visualization</p></div>
<div id="result-panel">
  <div class="unit">Recommended Fertilizer</div>
  <div class="value" id="fert-val">NPK 19:19:19</div>
  <div class="npk-bar">
    <div class="npk-item"><div class="letter" style="color:#ef5350">N</div><div class="val">Nitrogen</div></div>
    <div class="npk-item"><div class="letter" style="color:#42a5f5">P</div><div class="val">Phosphorus</div></div>
    <div class="npk-item"><div class="letter" style="color:#66bb6a">K</div><div class="val">Potassium</div></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x0a1a0a,.012);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,1000);
camera.position.set(0,5,12);camera.lookAt(0,1,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xa8c380,.5));
const dl=new THREE.DirectionalLight(0xffffff,.7);dl.position.set(5,10,5);scene.add(dl);
const pl1=new THREE.PointLight(0xef5350,.5,20);pl1.position.set(-4,3,0);scene.add(pl1);
const pl2=new THREE.PointLight(0x42a5f5,.5,20);pl2.position.set(4,3,0);scene.add(pl2);
const pl3=new THREE.PointLight(0x66bb6a,.5,20);pl3.position.set(0,3,-4);scene.add(pl3);

// Ground
const gnd=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshStandardMaterial({color:0x1a2e1a,roughness:.9}));
gnd.rotation.x=-Math.PI/2;scene.add(gnd);scene.add(new THREE.GridHelper(30,30,0x2d4a2d,0x1e3a1e));

// NPK Molecule visualization
const molGroup=new THREE.Group();

// Central atom
const centerGeo=new THREE.IcosahedronGeometry(1.2,2);
const centerMat=new THREE.MeshStandardMaterial({color:0xdaa520,metalness:.4,roughness:.3,emissive:0xdaa520,emissiveIntensity:.15});
const center=new THREE.Mesh(centerGeo,centerMat);molGroup.add(center);

// N, P, K orbiting atoms
const atomData=[
  {color:0xef5350,emissive:0xef5350,radius:.7,orbit:3.5,speed:1,y:0,label:'N'},
  {color:0x42a5f5,emissive:0x42a5f5,radius:.6,orbit:3,speed:1.3,y:.8,label:'P'},
  {color:0x66bb6a,emissive:0x66bb6a,radius:.65,orbit:3.2,speed:.8,y:-.6,label:'K'}
];
const atoms=[];
atomData.forEach(d=>{
  const geo=new THREE.SphereGeometry(d.radius,32,32);
  const mat=new THREE.MeshStandardMaterial({color:d.color,metalness:.5,roughness:.2,emissive:d.emissive,emissiveIntensity:.2});
  const mesh=new THREE.Mesh(geo,mat);mesh.userData=d;molGroup.add(mesh);atoms.push(mesh);
  // Orbit ring
  const ringGeo=new THREE.TorusGeometry(d.orbit,.02,8,64);
  const ringMat=new THREE.MeshBasicMaterial({color:d.color,transparent:true,opacity:.2});
  const ring=new THREE.Mesh(ringGeo,ringMat);ring.rotation.x=Math.PI/2+d.y*.3;molGroup.add(ring);
  // Bond line
  const bondGeo=new THREE.CylinderGeometry(.03,.03,d.orbit,8);
  const bondMat=new THREE.MeshBasicMaterial({color:d.color,transparent:true,opacity:.3});
  const bond=new THREE.Mesh(bondGeo,bondMat);bond.userData={atom:mesh,orbit:d.orbit};molGroup.add(bond);
});
molGroup.position.y=2.5;scene.add(molGroup);

// Particles
const pGeo=new THREE.BufferGeometry();const pN=400;const pp=new Float32Array(pN*3);
for(let i=0;i<pN;i++){pp[i*3]=(Math.random()-.5)*20;pp[i*3+1]=Math.random()*12;pp[i*3+2]=(Math.random()-.5)*20}
pGeo.setAttribute('position',new THREE.BufferAttribute(pp,3));
scene.add(new THREE.Points(pGeo,new THREE.PointsMaterial({color:0x558b2f,size:.06,transparent:true,opacity:.4})));

let t=0;
function animate(){
  requestAnimationFrame(animate);t+=.015;
  atoms.forEach(a=>{
    const d=a.userData;
    a.position.x=Math.cos(t*d.speed)*d.orbit;
    a.position.z=Math.sin(t*d.speed)*d.orbit;
    a.position.y=Math.sin(t*d.speed*2)*d.y;
  });
  center.rotation.y=t*.5;center.rotation.x=Math.sin(t*.3)*.2;
  molGroup.rotation.y=t*.1;
  renderer.render(scene,camera);
}
animate();
setTimeout(()=>{document.getElementById('result-panel').style.opacity='1'},1200);

window.addEventListener('message',e=>{if(e.data&&e.data.fertilizer){document.getElementById('fert-val').textContent=e.data.fertilizer}});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
