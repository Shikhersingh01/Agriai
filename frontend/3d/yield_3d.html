<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgriAI — Yield Predictor 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a1a0a;overflow:hidden;font-family:'Segoe UI',sans-serif}
canvas{display:block}
#overlay{position:absolute;top:20px;left:20px;color:#a8c380;font-size:14px;z-index:10;pointer-events:none}
#overlay h2{color:#daa520;font-size:28px;margin-bottom:4px;text-shadow:0 0 20px rgba(218,165,32,.4)}
#overlay p{opacity:.7}
#result-panel{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(26,46,26,.85);backdrop-filter:blur(12px);border:1px solid rgba(168,195,128,.25);border-radius:16px;padding:20px 40px;text-align:center;color:#f0ead6;z-index:10;pointer-events:none;opacity:0;transition:opacity .6s}
#result-panel .value{font-size:48px;font-weight:900;color:#daa520;text-shadow:0 0 30px rgba(218,165,32,.5)}
#result-panel .unit{font-size:16px;color:#a8c380;letter-spacing:3px;text-transform:uppercase}
</style>
</head>
<body>
<div id="overlay"><h2>🌾 Yield Predictor</h2><p>3D Crop Yield Visualization</p></div>
<div id="result-panel"><div class="unit">Predicted Yield</div><div class="value" id="yield-val">—</div><div class="unit">Tons / Hectare</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x0a1a0a,.015);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,1000);
camera.position.set(0,8,16);camera.lookAt(0,2,0);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);

// Lights
const ambient=new THREE.AmbientLight(0xa8c380,.4);scene.add(ambient);
const sun=new THREE.DirectionalLight(0xdaa520,.8);sun.position.set(5,10,5);sun.castShadow=true;scene.add(sun);
const point=new THREE.PointLight(0x7cb342,.6,30);point.position.set(-5,8,-5);scene.add(point);

// Ground plane
const groundGeo=new THREE.PlaneGeometry(40,40,20,20);
const groundMat=new THREE.MeshStandardMaterial({color:0x1a2e1a,roughness:.9});
const ground=new THREE.Mesh(groundGeo,groundMat);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

// Grid helper
const grid=new THREE.GridHelper(40,40,0x2d4a2d,0x1e3a1e);scene.add(grid);

// Bars representing crops
const crops=['Wheat','Rice','Sugarcane','Mustard'];
const colors=[0xdaa520,0x7cb342,0x8d6e63,0xc8a951];
const yields=[4.2,3.8,65.0,1.5];
const maxY=Math.max(...yields);
const bars=[];
const barGroup=new THREE.Group();

crops.forEach((c,i)=>{
  const h=Math.max((yields[i]/maxY)*8,.3);
  const geo=new THREE.BoxGeometry(1.8,.01,1.8);
  const mat=new THREE.MeshStandardMaterial({color:colors[i],metalness:.3,roughness:.5,transparent:true,opacity:.9});
  const bar=new THREE.Mesh(geo,mat);
  bar.position.set((i-1.5)*3,0,0);bar.castShadow=true;
  bar.userData={targetHeight:h,crop:c,yieldVal:yields[i]};
  barGroup.add(bar);bars.push(bar);

  // Label sprite
  const canvas2=document.createElement('canvas');canvas2.width=256;canvas2.height=64;
  const ctx=canvas2.getContext('2d');ctx.fillStyle='#daa520';ctx.font='bold 28px Segoe UI';
  ctx.textAlign='center';ctx.fillText(c,128,40);
  const tex=new THREE.CanvasTexture(canvas2);
  const spriteMat=new THREE.SpriteMaterial({map:tex,transparent:true});
  const sprite=new THREE.Sprite(spriteMat);sprite.scale.set(3,.75,1);
  sprite.position.set((i-1.5)*3,-.5,0);barGroup.add(sprite);
});
scene.add(barGroup);

// Floating particles (seeds/pollen)
const particleGeo=new THREE.BufferGeometry();
const pCount=500;const positions=new Float32Array(pCount*3);const pColors=new Float32Array(pCount*3);
for(let i=0;i<pCount;i++){
  positions[i*3]=(Math.random()-.5)*30;positions[i*3+1]=Math.random()*15;positions[i*3+2]=(Math.random()-.5)*30;
  const c=new THREE.Color().setHSL(.2+Math.random()*.15,.6,.5);
  pColors[i*3]=c.r;pColors[i*3+1]=c.g;pColors[i*3+2]=c.b;
}
particleGeo.setAttribute('position',new THREE.BufferAttribute(positions,3));
particleGeo.setAttribute('color',new THREE.BufferAttribute(pColors,3));
const particleMat=new THREE.PointsMaterial({size:.08,vertexColors:true,transparent:true,opacity:.6});
const particles=new THREE.Points(particleGeo,particleMat);scene.add(particles);

let time=0;
function animate(){
  requestAnimationFrame(animate);time+=.01;
  // Grow bars
  bars.forEach(b=>{
    const th=b.userData.targetHeight;
    if(b.scale.y<th*100){b.scale.y=Math.min(b.scale.y+th*1.5,th*100);b.position.y=b.scale.y*.005}
  });
  // Rotate scene slowly
  barGroup.rotation.y=Math.sin(time*.3)*.3;
  // Float particles
  const pos=particleGeo.attributes.position.array;
  for(let i=0;i<pCount;i++){pos[i*3+1]+=Math.sin(time+i)*.003;if(pos[i*3+1]>15)pos[i*3+1]=0}
  particleGeo.attributes.position.needsUpdate=true;
  particles.rotation.y=time*.05;
  renderer.render(scene,camera);
}
animate();

// Show result panel after animation
setTimeout(()=>{document.getElementById('result-panel').style.opacity='1'},1500);

// Receive data from parent
window.addEventListener('message',e=>{
  if(e.data&&e.data.yield_value!==undefined){
    document.getElementById('yield-val').textContent=e.data.yield_value;
    document.getElementById('result-panel').style.opacity='1';
    // Update bar heights proportionally
    if(e.data.bar_data){
      e.data.bar_data.forEach((v,i)=>{if(bars[i])bars[i].userData.targetHeight=Math.max((v/maxY)*8,.3);bars[i].scale.y=1});
    }
  }
});

window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
