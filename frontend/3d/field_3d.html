<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AgriAI — Field Analyzer 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a1a0a;overflow:hidden;font-family:'Segoe UI',sans-serif}
#overlay{position:absolute;top:20px;left:20px;color:#a8c380;font-size:14px;z-index:10;pointer-events:none}
#overlay h2{color:#daa520;font-size:28px;margin-bottom:4px;text-shadow:0 0 20px rgba(218,165,32,.4)}
#legend{position:absolute;top:20px;right:20px;background:rgba(26,46,26,.85);backdrop-filter:blur(12px);border:1px solid rgba(168,195,128,.25);border-radius:12px;padding:16px;color:#f0ead6;z-index:10;pointer-events:none}
.legend-item{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.legend-dot{width:12px;height:12px;border-radius:50%}
#stats{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);display:flex;gap:16px;z-index:10;pointer-events:none;opacity:0;transition:opacity .6s}
.stat-card{background:rgba(26,46,26,.85);backdrop-filter:blur(12px);border:1px solid rgba(168,195,128,.25);border-radius:12px;padding:14px 24px;text-align:center;color:#f0ead6}
.stat-card .num{font-size:28px;font-weight:900}
.stat-card .lbl{font-size:11px;color:#a8c380;letter-spacing:2px;text-transform:uppercase}
</style>
</head>
<body>
<div id="overlay"><h2>🛰️ Field Analyzer</h2><p>3D Vegetation Health Terrain</p></div>
<div id="legend">
  <div style="font-weight:700;color:#c8a951;margin-bottom:8px">Health Zones</div>
  <div class="legend-item"><div class="legend-dot" style="background:#4caf50"></div>Healthy</div>
  <div class="legend-item"><div class="legend-dot" style="background:#ffc107"></div>Moderate</div>
  <div class="legend-item"><div class="legend-dot" style="background:#f44336"></div>Stressed</div>
</div>
<div id="stats">
  <div class="stat-card"><div class="num" style="color:#4caf50" id="h-pct">68%</div><div class="lbl">Healthy</div></div>
  <div class="stat-card"><div class="num" style="color:#ffc107" id="m-pct">22%</div><div class="lbl">Moderate</div></div>
  <div class="stat-card"><div class="num" style="color:#f44336" id="s-pct">10%</div><div class="lbl">Stressed</div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x0a1a0a,.008);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,500);
camera.position.set(12,10,12);camera.lookAt(0,0,0);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xb8c9a0,.4));
const dl=new THREE.DirectionalLight(0xffffff,.7);dl.position.set(10,15,10);dl.castShadow=true;scene.add(dl);

// Terrain grid
const gridSize=20;const tileSize=.9;const terrainGroup=new THREE.Group();
const healthColors=[0x4caf50,0x66bb6a,0x8bc34a,0xffc107,0xff9800,0xf44336];

for(let x=0;x<gridSize;x++){
  for(let z=0;z<gridSize;z++){
    const noise=Math.sin(x*.5)*Math.cos(z*.5)*.5+Math.random()*.3;
    const healthIdx=Math.floor(Math.max(0,Math.min(5,(1-noise-Math.random()*.3)*3)));
    const h=.3+noise+Math.random()*.4;
    const geo=new THREE.BoxGeometry(tileSize,h,tileSize);
    const mat=new THREE.MeshStandardMaterial({color:healthColors[healthIdx],roughness:.6,metalness:.1});
    const tile=new THREE.Mesh(geo,mat);
    tile.position.set((x-gridSize/2)*1,(h/2),(z-gridSize/2)*1);
    tile.castShadow=true;tile.receiveShadow=true;
    tile.userData={baseY:h/2,phase:Math.random()*Math.PI*2};
    terrainGroup.add(tile);
  }
}
scene.add(terrainGroup);

// Drone scan line
const scanGeo=new THREE.PlaneGeometry(gridSize,0.1);
const scanMat=new THREE.MeshBasicMaterial({color:0x7cb342,transparent:true,opacity:.4,side:THREE.DoubleSide});
const scanLine=new THREE.Mesh(scanGeo,scanMat);scanLine.position.y=3;scanLine.rotation.x=Math.PI/2;scene.add(scanLine);

let t=0;
function animate(){
  requestAnimationFrame(animate);t+=.01;
  camera.position.x=12*Math.cos(t*.1);camera.position.z=12*Math.sin(t*.1);
  camera.lookAt(0,0,0);
  // Scan line sweep
  scanLine.position.z=Math.sin(t*.5)*gridSize/2;
  scanLine.material.opacity=.2+Math.sin(t*3)*.2;
  // Gentle tile breathing
  terrainGroup.children.forEach(tile=>{
    if(tile.userData.baseY)tile.position.y=tile.userData.baseY+Math.sin(t+tile.userData.phase)*.05;
  });
  renderer.render(scene,camera);
}
animate();
setTimeout(()=>{document.getElementById('stats').style.opacity='1'},1500);

window.addEventListener('message',e=>{
  if(e.data){
    if(e.data.health_pct!==undefined)document.getElementById('h-pct').textContent=e.data.health_pct+'%';
    if(e.data.moderate_pct!==undefined)document.getElementById('m-pct').textContent=e.data.moderate_pct+'%';
    if(e.data.stress_pct!==undefined)document.getElementById('s-pct').textContent=e.data.stress_pct+'%';
  }
});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
